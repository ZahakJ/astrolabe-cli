name: Bug report
description: Something behaves differently from what the manual says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. One bug per report.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `astrolabe doctor`
      description: It reports the version, the terminal, the colour depth, the bidi mode and which vault was chosen. Remove paths you consider private.
      render: text
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: A note that reproduces it
      description: If rendering is wrong, a few lines of Markdown that show it. Do not paste private notes.
      render: markdown
